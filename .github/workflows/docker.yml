name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import smoke test
        env:
          CONFIG_DIR: /tmp/insta/config
          DATA_DIR: /tmp/insta/data
          DOWNLOADS_ROOT: /tmp/insta/downloads
        run: |
          python -m compileall -q app
          python -c "import app.main"
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(python -c "import app; print(app.__version__)")
          if [ "v${APP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/__init__.py __version__ (${APP_VERSION})"
            exit 1
          fi

  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Bundle compose files
        run: |
          mkdir -p dist/insta-webui/{config,data,downloads}
          sed "s#^\(\s*image:\).*#\1 ghcr.io/${IMAGE_NAME}:${VERSION}#; /^\s*build:/d" \
            docker-compose.yml > dist/insta-webui/docker-compose.yml
          cp README.md dist/insta-webui/
          tar -C dist -czf "insta-webui-${GITHUB_REF_NAME}.tar.gz" insta-webui

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: insta-webui-${{ github.ref_name }}.tar.gz
          body: |
            ## Docker image
            ```bash
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ```
            Platforms: `linux/amd64`, `linux/arm64`

            첨부된 `insta-webui-${{ github.ref_name }}.tar.gz`를 풀고 `docker compose up -d` 하면 이 버전으로 바로 실행됩니다.
