<!doctype html>
<html lang="ko" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Insta WebUI{% endblock %}</title>
  <link rel="alternate" type="application/rss+xml" title="Instagram Feed" href="{{ base }}/rss">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script>
    (() => {
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <style>
    .log-box { height: 320px; overflow-y: auto; font-size: .8rem; white-space: pre-wrap; }
    .post-card img, .post-card video { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
    .caption { font-size: .85rem; max-height: 6.5em; overflow: hidden; }
    .feed-url { font-size: .85rem; }
  </style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-body border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/"><i class="bi bi-instagram"></i> Insta WebUI</a>
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">대시보드</a></li>
      <li class="nav-item"><a class="nav-link {% if request.url.path == '/settings' %}active{% endif %}" href="/settings">설정</a></li>
      <li class="nav-item"><a class="nav-link {% if request.url.path == '/posts' %}active{% endif %}" href="/posts">게시물</a></li>
    </ul>
  </div>
</nav>
<main class="container pb-5">
  {% if msg %}
  <div class="alert alert-{{ level }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
