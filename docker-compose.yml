services:
  insta-webui:
    image: ghcr.io/jhkim0712/insta_webui:latest
    build: .
    container_name: insta-webui
    restart: unless-stopped
    # 호스트 파일 소유자로 실행하려면 주석 해제 (Linux 호스트 권장)
    # user: "1000:1000"
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Seoul
      # RSS에 들어가는 절대 URL의 기준 주소 (리버스 프록시/외부 도메인 사용 시 지정)
      # - PUBLIC_BASE_URL=https://insta.example.com
    volumes:
      - ./config:/config
      - ./data:/data
      - ./downloads:/downloads
